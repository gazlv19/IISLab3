<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haptic Tracing</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/gohai/p5.webserial@main/libraries/p5.webserial.js"></script>
  <style>
    html, body { margin: 0; overflow: hidden; background: #d9ecf7; }
    button { font: 700 16px "Trebuchet MS", sans-serif; padding: 10px 18px; border: 0;
             border-radius: 12px; background: #1f4e79; color: #fff; cursor: pointer; margin-right: 8px; }
    button:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
    #ui { position: absolute; top: 12px; left: 12px; }
  </style>
</head>
<body>
  <div id="ui"></div>
  <script src="sketch.js"></script>
</body>
</html>
